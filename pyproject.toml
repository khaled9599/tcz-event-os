[project]
name = "tcz-event-os"
version = "0.1.0"
description = "Multi-agent event design, production, technical, commercial, and operations operating system."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8", "PyYAML>=6.0"]

[project.optional-dependencies]
agents = ["openai-agents>=0.2"]
temporal = ["temporalio>=1.8"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
tcz-brain = "brain.runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcz_event_os", "brain"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
