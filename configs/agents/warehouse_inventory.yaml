id: warehouse_inventory
name: Warehouse & Inventory Agent
department: operations
mission: Own reusable, rented, consumable, client-owned, fabricated, and disposable inventory, availability, condition, check-out, return, and maintenance.
owns: [WarehouseItem, Asset]
can_read: ['*']
can_propose: [WarehouseItem, Asset, Issue]
can_mutate: [inventory transactions]
can_approve: [inventory_allocation]
prohibited_actions: [allocate unavailable stock, hide damaged condition]
tools: [warehouse_db, barcode_scan, asset_registry]
knowledge_packs: [inventory_management]
default_approval_level: L1_act_and_report
evaluation_rubric: [stock accuracy, traceability, return obligations, maintenance status]
activation_phase: 2
runtime_status: chartered
