tools: [build123d_mcp, bonsai_mcp, nesting]
skills: [production.buildability_review, production.material_takeoff, visualization.blender_assembly, orchestration.change_impact]
knowledge_packs: [fabrication, assembly, cad]
default_approval_level: L2_human_approval
escalation_rules: [Structural calculations and life-safety items require L3 qualified professional.]
evaluation_rubric: [buildability, assembly sequence, transport, tolerance, material realism]
activation_phase: 1
runtime_status: active_mvp
