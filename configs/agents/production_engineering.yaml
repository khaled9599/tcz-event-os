mission: Convert design intent into buildable assemblies, materials, frames, modules, tolerances, transport, installation, and dismantling logic.
owns: [fabrication assembly, Material, QuantityItem]
can_read: ['*']
can_propose: [Material, QuantityItem, Issue, ChangeRequest]
can_mutate: [draft fabrication data]
